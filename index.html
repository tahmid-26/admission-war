<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admission Study Tracker</title>
<style>
:root{--bg:#e9f0ee;--card:#fff;--ink:#17262a;--mut:#5b6e72;--ac:#16706a;--acs:#d3e9e6;--bd:#cbdad7;--bad:#b3402a;--hd:#0f3d3a;--vbh:60px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1517;--card:#172225;--ink:#e6efee;--mut:#97aeb1;--ac:#4fb3ac;--acs:#1f3637;--bd:#2a3c3f;--bad:#e07a62;--hd:#091214}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
button,select,input,.btn{font:inherit;font-size:.92rem;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink)}
button,.btn{cursor:pointer;display:inline-block}
input[type=checkbox]{padding:0;width:20px;height:20px;accent-color:var(--ac);vertical-align:middle}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.ghost{background:var(--acs);border-color:var(--acs)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
/* verse bar */
#vb{position:sticky;top:0;z-index:8;background:linear-gradient(135deg,var(--hd),#14564f);color:#eaf6f4;padding:8px 14px 10px;box-shadow:0 2px 10px #0004;transition:opacity .5s}
#vb.fade{opacity:0}#vb .vh{display:flex;align-items:center;gap:8px;font-size:.78rem;flex-wrap:wrap}
.chip{background:#ffffff26;border-radius:999px;padding:2px 10px;font-weight:600}#vb .mut{color:#b9d6d2}
.vbtn{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#vb button,#vb select{background:#ffffff1f;border:none;color:#eaf6f4;padding:4px 10px;border-radius:999px;font-size:.78rem}#vb select option{color:#000}
.vbody{max-height:7.5em;overflow:hidden;cursor:pointer;margin-top:6px}.vbody.open{max-height:none}
.ar{font:1.35rem/2 "Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic",serif;text-align:right}
.tr{font-size:.92rem;margin-top:2px}#vb a{color:#9be7dd}
.sc{cursor:pointer}.sc.bad{color:#ffd0c4}
/* layout */
#shell{display:block}
main{padding:12px;max-width:760px;margin:0 auto}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:7;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
#nav button{display:flex;flex-direction:column;align-items:center;flex:1;font-size:.72rem;padding:6px 4px;border:none;border-radius:12px;color:var(--mut);background:none}
#nav button span{font-size:1.25rem;line-height:1.2}#nav button.on{color:var(--ac);background:var(--acs);font-weight:700}
@media(min-width:900px){
 body{padding-bottom:0}
 #shell{display:flex;align-items:flex-start}
 #nav{position:sticky;top:var(--vbh);bottom:auto;left:auto;right:auto;flex-direction:column;width:168px;height:calc(100vh - var(--vbh));border-top:none;border-right:1px solid var(--bd);padding:14px 10px;gap:6px;flex:none}
 #nav button{flex:none;flex-direction:row;gap:10px;font-size:.95rem;padding:10px 12px}
 main{flex:1;max-width:none;margin:0;padding:18px 26px;min-width:0}
 .day{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0 18px;align-items:start}
 .sch{grid-column:1;grid-row:1/span 2}.sumc{grid-column:2;grid-row:1}.side{grid-column:2;grid-row:2}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
}
/* components */
.card,.blk,.row,.chc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h2{font:700 1rem Georgia,serif;margin:0 0 6px}.hi{font:700 1.15rem Georgia,serif}
.gh{font:600 .8rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 4px 2px}
.blk{padding:9px 14px;margin:6px 0}.blk.dn{background:var(--acs)}.blk.dn .bl{color:var(--mut);text-decoration:line-through}
.bt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bl{flex:1;min-width:140px}
.t{font-weight:600;color:var(--ac);font-variant-numeric:tabular-nums;white-space:nowrap}
.pc{font-size:.78rem;background:var(--acs);border-radius:999px;padding:1px 9px;color:var(--ac);font-weight:600}
.steps{display:flex;gap:4px 14px;flex-wrap:wrap;margin:6px 0 2px 2px;font-size:.88rem}.steps label{display:flex;gap:6px;align-items:center;cursor:pointer}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.f{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}.f input[type=text]{flex:1;min-width:130px}
.mut{color:var(--mut);font-size:.85rem}.bar{height:8px;background:var(--acs);border-radius:4px}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.rings{display:flex;gap:8px;flex-wrap:wrap}.rings button{display:flex;flex-direction:column;align-items:center;padding:8px 14px;flex:1;min-width:90px}
.rings button.on{border-color:var(--ac);background:var(--acs)}
.row{display:grid;grid-template-columns:1fr 56px 56px 56px;align-items:center;margin:0;padding:0;border:none;background:none}
.hdr{display:grid;grid-template-columns:1fr 56px 56px 56px;font-size:.8rem;color:var(--mut);padding:6px 14px 0;text-align:center}.hdr span:first-child{text-align:left}
.row input{justify-self:center}.chc{padding:10px 14px;margin:6px 0}.cls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.88rem}.cls input{width:62px;padding:4px 6px}.cls button{padding:2px 12px}
em{display:block;font-size:.8rem;color:var(--mut);font-style:normal}
.x{background:none;border:none;color:var(--bad);padding:2px 8px}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--bd)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.warn{color:var(--bad)}.ok{color:var(--ac)}
#md{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#md[hidden]{display:none}
.mdc{background:var(--card);border-radius:16px;padding:18px;max-width:420px;width:100%}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--hd);color:#fff;padding:8px 16px;border-radius:999px;z-index:30;font-size:.9rem;max-width:90%}
#toast[hidden]{display:none}
@media(prefers-reduced-motion:reduce){#vb{transition:none}}
#nav button{position:relative}
.bdg{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;font:700 .65rem system-ui;border-radius:999px;padding:0 6px;font-style:normal;line-height:1.4}
.allck{display:flex;gap:10px;align-items:center;padding:10px 14px;margin:6px 0;cursor:pointer}
@media(min-width:900px){#nav button .bdg{position:static;margin-left:auto}}
</style>
</head>
<body>
<div id="vb" aria-live="polite"></div>
<div id="shell"><nav id="nav"></nav><main id="app"></main></div>
<div id="md" hidden><div class="mdc"><div id="mdt"></div><div class="f" id="mdb"></div></div></div>
<div id="toast" hidden></div>
<script src="data.js"></script>
<script src="verses.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
